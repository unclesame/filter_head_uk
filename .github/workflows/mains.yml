name: Sync to Deploy Repo

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to deploy repo
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          # Remove any credential helpers
          git config --unset-all http.https://github.com/.extraheader || true
          git config --global --unset-all http.https://github.com/.extraheader || true
          
          # Set auth explicitly
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(echo -n "x-access-token:${DEPLOY_TOKEN}" | base64)"
          
          git remote add deploy https://github.com/unclesame/filter_head_uk.git
          git push deploy main --force
